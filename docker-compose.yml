services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inquiry_app
      POSTGRES_USER: inquiry
      POSTGRES_PASSWORD: inquiry
    ports:
      - "5433:5432"
    volumes:
      - inquiry_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  inquiry_data:
